name: status

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub may delay or skip scheduled runs under load; that is fine
  workflow_dispatch:
  push:
    branches: [main] # rebuild when the script or the template changes

# The build job, which runs this repository's code, can only read it. Only the deploy job holds the Pages rights.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test "scripts/*.test.mjs"
      # Exits non-zero before writing dist/ if anything could not be fetched, so nothing below runs and the
      # last good page stays up.
      - name: Build the page
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
